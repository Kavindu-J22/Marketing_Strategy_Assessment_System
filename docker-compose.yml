version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: marketing_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - SUPABASE_URL=${SUPABASE_URL:-https://your-supabase-url.supabase.co}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-your_anon_key}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-your_service_role_key}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-your_jwt_secret}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - MODEL_ARTIFACT_DIR=/app/ml/artifacts
      - ML_DEVICE=cpu
    volumes:
      - ./ml/artifacts:/app/ml/artifacts
      - ./Dataset:/app/Dataset
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: marketing_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
      - VITE_SUPABASE_URL=${SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    depends_on:
      - backend
